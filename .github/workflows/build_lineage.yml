name: Build LineageOS 20 (Cactus)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk libtinfo5
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize Repo & Shallow Sync Source
        run: |
          export PATH=~/bin:$PATH
          mkdir -p /home/runner/work/android
          cd /home/runner/work/android
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --current-branch -j$(nproc --all)

      - name: Clone Device, Vendor, & Kernel Trees
        run: |
          cd /home/runner/work/android
          # Ganti URL dan branch ini dengan tree Redmi 6A kamu
          git clone <URL_DEVICE_TREE_CACTUS> -b <branch_name> device/xiaomi/cactus
          git clone <URL_VENDOR_TREE_CACTUS> -b <branch_name> vendor/xiaomi/cactus
          git clone <URL_KERNEL_TREE_CACTUS> -b <branch_name> kernel/xiaomi/cactus

      - name: Compile ROM
        run: |
          cd /home/runner/work/android
          export USE_CCACHE=1
          source build/envsetup.sh
          lunch lineage_cactus-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Build Output to Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: /home/runner/work/android/out/target/product/cactus/lineage-20.0-*.zip
          tag_name: lineage-20.0-cactus-${{ github.run_number }}
          name: LineageOS 20 for Redmi 6A (Cactus)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
